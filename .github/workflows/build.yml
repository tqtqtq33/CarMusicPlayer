name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  # 允許手動觸發
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 取得原始碼
      - name: 🔄 Checkout code
        uses: actions/checkout@v4

      # 2. 設定 JDK 17
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. 賦予 gradlew 執行權限
      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 下載 Gradle Wrapper JAR（因為 .jar 未入版控）
      - name: 📦 Download Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          curl -sL \
            "https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar || \
          wget -q \
            "https://services.gradle.org/distributions/gradle-8.6-bin.zip" \
            -O /tmp/gradle.zip && \
            unzip -p /tmp/gradle.zip '*/lib/gradle-wrapper.jar' \
              > gradle/wrapper/gradle-wrapper.jar || true

      # 5. 建置 Debug APK（不需簽名金鑰）
      - name: 🔨 Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

      # 6. 上傳 APK 為 Artifact
      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CarMusic-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # ── 以下為 Release 簽名版（選用，需設定 Secrets）──────────
      # 如要產出 release APK，在 GitHub repo Settings → Secrets 加入：
      #   KEYSTORE_BASE64   : base64 編碼的 keystore 檔案
      #   KEY_ALIAS         : key alias
      #   KEY_PASSWORD      : key password
      #   STORE_PASSWORD    : store password

      - name: 🔐 Build Release APK (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.jks
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=/tmp/release.jks \
              -Pandroid.injected.signing.store.password=${{ secrets.STORE_PASSWORD }} \
              -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
              -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}
          else
            echo "⚠️ 未設定簽名 Secrets，跳過 Release Build"
          fi

      - name: 📤 Upload Release APK (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: CarMusic-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
        continue-on-error: true
